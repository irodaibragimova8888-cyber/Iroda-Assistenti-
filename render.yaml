services:
  - type: web
    name: grok-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: TELEGRAM_TOKEN
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-4
